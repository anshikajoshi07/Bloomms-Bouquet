<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
            padding-top: 40px;
            padding-bottom: 40px;
        }
        .form-container {
            background: #ffffff;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-width: 400px;
            margin: auto;
        }
        .btn-back {
            background-color: #6c757d;
            color: #fff;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
        .forgot-password, .signup-link {
            font-size: 14px;
        }
        .forgot-password {
            text-align: right;
        }
        .forgot-password a,
        .signup-link a {
            color: #007bff;
            text-decoration: none;
        }
        .forgot-password a:hover,
        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h4 class="text-center mb-3">Sign Up</h4>
    <form action="index.html" method="post">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <div class="forgot-password mb-3">
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        <button type="button" class="btn btn-back w-100 mt-2" onclick="history.back()">Back</button>
    </form>

    <p class="signup-link mt-3 text-center">Have an account? <a href="index.html">Login here</a></p>
</div>

</body>
</html>
