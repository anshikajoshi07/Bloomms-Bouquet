<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Form</title>
  <!-- Bootstrap CDN रहेगा -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;background-color:#f4f4f4;margin:0;">

  <div style="background:#fff;padding:30px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);width:100%;max-width:380px;">
    <h3 style="text-align:center;margin-bottom:20px;">Sign In</h3>
    <form action="signUp" method="post">
      <div class="mb-3">
        <label for="username" style="display:block;text-align:left;font-weight:500;margin-bottom:5px;">Username</label>
        <input type="text" name="username" class="form-control" id="username" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label for="password" style="display:block;text-align:left;font-weight:500;margin-bottom:5px;">Password</label>
        <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required>
      </div>

      <div style="text-align:right;font-size:14px;margin-bottom:10px;">
        <a href="#" style="color:#007bff;text-decoration:none;">Forgot Password?</a>
      </div>

      <button type="submit" value="login" class="btn btn-primary w-100" style="margin-bottom:10px;">Sign In</button>
      <button type="button" class="btn w-100" onclick="history.back()" style="background-color:#6c757d;color:#fff;">Back</button>
    </form>

    <p style="text-align:center;font-size:14px;margin-top:15px;">
      Don't have an account? 
      <a href="index2.html" style="color:#007bff;text-decoration:none;">Sign Up here</a>
    </p>
  </div>

</body>
</html>
